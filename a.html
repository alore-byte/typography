<html>
<head>


    <title>

        Bootstrap Typography example

    </title>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>

</head>
<body>
    <div class="container">
        <h2>Heading Lists</h2>
        <h2 class="display-1">Codingal</h2>
        <h2 class="display-2">Codingal</h2>
        <h2 class="display-3">Codingal</h2>
        <h2 class="display-4">Codingal</h2>
    </div>
    <div class="container">
        <h1>THis is typography, it help the audience be interested in what they are reading.
            <small class="text muted">Hello Codingal</small>
        </h1>
        <dl>
            <dt>Tasty Sodas</dt>
            <dd>Delious and refeshing, cold drink.</dd>

        </dl>
    </div>
</body>
</html>
